name: InfMasking

# UniGIR V3 first implementation: replace only the V2 cosine profile
# distance with a prototype-graph geodesic profile.

model:
  _target_: pl_modules.infmasking.InfMasking
  encoder:
    _target_: models.inffusion.InfFusion
    embed_dim: 40
    fusion: "concat"
    pool: "cls"
    n_heads: 8
    n_layers: 1
    add_bias_kv: False
    dropout: 0
    mask_ratio: 0.7
    num_mask: 6

  projection:
    _target_: pl_modules.infmasking.InfMasking._build_mlp
    in_dim: ${model.model.encoder.embed_dim}
    mlp_dim: 512
    out_dim: 256

  loss_kwargs:
    temperature: 0.1
    mask_lambda: 1
    profile_kwargs:
      dim: 256
      num_prototypes: 128
      temperature: 0.1
      sinkhorn_iters: 3
      sinkhorn_eps: 0.05
      update_rate: 0.05
      loss_weight: 0.25
      cross: false
      shuffle_targets: false
      queue_size: 1024
      init_seed: ${seed}
      distance_mode: geodesic
      graph_k: 8
      graph_anchors: 4
      graph_update_frequency: 1
      geodesic_temperature: 0.1
